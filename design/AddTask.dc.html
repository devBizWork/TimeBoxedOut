<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit routine sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#15111F}
a{color:#4B2E83;text-decoration:none}a:hover{color:#35206A}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1120px; position: relative; overflow: hidden; background: #15111F; color: #15111F; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums">

<div aria-hidden="true" style="position: absolute; left: 14px; right: 14px; top: 40px; height: 40px; border-radius: 22px 22px 0 0; background: #4A4458"></div>

<section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; top: 52px; bottom: 0; border-radius: 28px 28px 0 0; background: #F5F2FA; padding: 0 16px 34px 16px; display: flex; flex-direction: column; gap: 12px">
<div aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #CFC6E0; margin-top: 8px"></div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: -4px">
<a href="Tasks.dc.html" style="height: 44px; padding: 0 8px 0 4px; display: flex; align-items: center; font-size: 15px; font-weight: 600; color: #4B2E83">Cancel</a>
<h2 id="sheet-title" style="margin: 0; font-size: 17px; font-weight: 700">Edit routine</h2>
<a href="Tasks.dc.html" style="height: 40px; padding: 0 18px; border-radius: 20px; background: #4B2E83; color: #FFFFFF; display: flex; align-items: center; font-size: 15px; font-weight: 700">Save</a>
</div>

<div style="padding: 12px 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E6E0F0; display: flex; flex-direction: column; gap: 2px">
<label for="t-title" style="font-size: 12px; font-weight: 700; color: #5E5670">Title</label>
<input id="t-title" type="text" value="Morning workout" style="border: 0; padding: 0; height: 30px; background: transparent; font-size: 20px; font-weight: 700; color: #15111F; outline: none">
</div>

<div style="padding: 14px 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E6E0F0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 20px">
<span style="font-size: 12px; font-weight: 700; color: #5E5670">When</span>
<button type="button" style="height: 44px; margin: -12px -8px; padding: 0 8px; border: 0; background: transparent; color: #4B2E83; font-size: 13px; font-weight: 700">Set end time instead</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" aria-label="Start time, 6:30 am" style="height: 58px; border: 0; border-radius: 14px; background: #F5F2FA; padding: 0 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; text-align: left; color: #15111F"><span style="font-size: 12px; font-weight: 600; color: #5E5670">Start</span><span style="font-size: 17px; font-weight: 700">6:30 am</span></button>
<button type="button" aria-label="Duration, 60 minutes, ends 7:30 am" style="height: 58px; border: 0; border-radius: 14px; background: #F5F2FA; padding: 0 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; text-align: left; color: #15111F"><span style="font-size: 12px; font-weight: 600; color: #5E5670">Duration · ends 7:30</span><span style="font-size: 17px; font-weight: 700">60 min</span></button>
</div>
<div role="group" aria-label="Quick durations" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
<button type="button" aria-pressed="false" style="height: 40px; border: 1px solid #E6E0F0; border-radius: 12px; background: #FFFFFF; color: #15111F; font-size: 13px; font-weight: 600; padding: 0">15</button>
<button type="button" aria-pressed="false" style="height: 40px; border: 1px solid #E6E0F0; border-radius: 12px; background: #FFFFFF; color: #15111F; font-size: 13px; font-weight: 600; padding: 0">30</button>
<button type="button" aria-pressed="false" style="height: 40px; border: 1px solid #E6E0F0; border-radius: 12px; background: #FFFFFF; color: #15111F; font-size: 13px; font-weight: 600; padding: 0">45</button>
<button type="button" aria-pressed="true" style="height: 40px; border: 1px solid #4B2E83; border-radius: 12px; background: #4B2E83; color: #FFFFFF; font-size: 13px; font-weight: 700; padding: 0">60</button>
<button type="button" aria-pressed="false" style="height: 40px; border: 1px solid #E6E0F0; border-radius: 12px; background: #FFFFFF; color: #15111F; font-size: 13px; font-weight: 600; padding: 0">90</button>
<button type="button" aria-pressed="false" style="height: 40px; border: 1px solid #E6E0F0; border-radius: 12px; background: #FFFFFF; color: #15111F; font-size: 13px; font-weight: 600; padding: 0">120</button>
</div>
</div>

<div style="padding: 14px 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E6E0F0; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 700; color: #5E5670">Repeat</span>
<div role="group" aria-label="Repeat" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 14px; background: #ECE8F4">
<button type="button" aria-pressed="false" style="height: 38px; border: 0; border-radius: 11px; background: transparent; color: #15111F; font-size: 13px; font-weight: 600; padding: 0">Once</button>
<button type="button" aria-pressed="true" style="height: 38px; border: 0; border-radius: 11px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(21, 17, 31, 0.14); color: #4B2E83; font-size: 13px; font-weight: 700; padding: 0">Daily</button>
<button type="button" aria-pressed="false" style="height: 38px; border: 0; border-radius: 11px; background: transparent; color: #15111F; font-size: 13px; font-weight: 600; padding: 0">Weekdays</button>
<button type="button" aria-pressed="false" style="height: 38px; border: 0; border-radius: 11px; background: transparent; color: #15111F; font-size: 13px; font-weight: 600; padding: 0">Custom</button>
</div>
<div role="group" aria-label="Days" style="display: flex; justify-content: space-between">
<button type="button" aria-pressed="true" aria-label="Monday" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #4B2E83; color: #FFFFFF; font-size: 13px; font-weight: 700; padding: 0">M</button>
<button type="button" aria-pressed="true" aria-label="Tuesday" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #4B2E83; color: #FFFFFF; font-size: 13px; font-weight: 700; padding: 0">T</button>
<button type="button" aria-pressed="true" aria-label="Wednesday" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #4B2E83; color: #FFFFFF; font-size: 13px; font-weight: 700; padding: 0">W</button>
<button type="button" aria-pressed="true" aria-label="Thursday" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #4B2E83; color: #FFFFFF; font-size: 13px; font-weight: 700; padding: 0">T</button>
<button type="button" aria-pressed="true" aria-label="Friday" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #4B2E83; color: #FFFFFF; font-size: 13px; font-weight: 700; padding: 0">F</button>
<button type="button" aria-pressed="true" aria-label="Saturday" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #4B2E83; color: #FFFFFF; font-size: 13px; font-weight: 700; padding: 0">S</button>
<button type="button" aria-pressed="true" aria-label="Sunday" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #4B2E83; color: #FFFFFF; font-size: 13px; font-weight: 700; padding: 0">S</button>
</div>
</div>

<div style="border-radius: 20px; background: #FFFFFF; border: 1px solid #E6E0F0; display: flex; flex-direction: column">
<div style="min-height: 58px; padding: 0 12px 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="font-size: 15px; font-weight: 600">Color</span>
<div role="group" aria-label="Color" style="display: flex; gap: 4px">
<button type="button" aria-pressed="true" aria-label="Mint" style="width: 36px; height: 36px; border: 0; border-radius: 18px; background: #D6F2E5; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #4B2E83; padding: 0; margin: 0 4px"></button>
<button type="button" aria-pressed="false" aria-label="Sky blue" style="width: 36px; height: 36px; border: 1px solid #D6CEE6; border-radius: 18px; background: #DCEBF8; padding: 0"></button>
<button type="button" aria-pressed="false" aria-label="Butter" style="width: 36px; height: 36px; border: 1px solid #D6CEE6; border-radius: 18px; background: #FAF0C6; padding: 0"></button>
<button type="button" aria-pressed="false" aria-label="Lilac" style="width: 36px; height: 36px; border: 1px solid #D6CEE6; border-radius: 18px; background: #E4DFFC; padding: 0"></button>
<button type="button" aria-pressed="false" aria-label="Pink" style="width: 36px; height: 36px; border: 1px solid #D6CEE6; border-radius: 18px; background: #F8DCEA; padding: 0"></button>
<button type="button" aria-pressed="false" aria-label="Peach" style="width: 36px; height: 36px; border: 1px solid #D6CEE6; border-radius: 18px; background: #FCE3D5; padding: 0"></button>
</div>
</div>
<button type="button" style="min-height: 58px; padding: 0 12px 0 16px; border: 0; border-top: 1px solid #EFEBF6; border-radius: 0 0 20px 20px; background: transparent; display: flex; align-items: center; gap: 10px; color: #15111F; text-align: left">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B2E83" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l10-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="16.5" cy="16" r="2.5"></circle></svg>
<span style="flex: 1; font-size: 15px; font-weight: 600">Chime for this task</span>
<span style="font-size: 14px; font-weight: 500; color: #5E5670">App default · Bamboo</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5670" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"></path></svg>
</button>
</div>

<div style="padding: 14px 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E6E0F0; display: flex; flex-direction: column; gap: 6px">
<label for="t-notes" style="font-size: 12px; font-weight: 700; color: #5E5670">Notes</label>
<textarea id="t-notes" rows="2" style="border: 0; padding: 0; height: 52px; resize: none; background: transparent; font-size: 15px; font-weight: 500; line-height: 1.45; color: #15111F; outline: none">Mobility first, then a 30-minute run.</textarea>
</div>

<div style="padding: 14px 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E6E0F0; display: flex; flex-direction: column; gap: 8px">
<span id="scope-h" style="font-size: 12px; font-weight: 700; color: #5E5670">Apply changes to</span>
<div role="radiogroup" aria-labelledby="scope-h" style="display: flex; flex-direction: column; gap: 8px">
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 62px; box-sizing: border-box; padding: 12px 14px; border-radius: 16px; border: 1px solid #E6E0F0; background: #FFFFFF; display: flex; align-items: flex-start; gap: 12px; text-align: left; color: #15111F">
<span aria-hidden="true" style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 10px; border: 1.5px solid #988DAE; background: #FFFFFF; flex-shrink: 0; margin-top: 1px"></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">This day only</span><span style="font-size: 12.5px; font-weight: 500; color: #5E5670">Changes Tue, Oct 6. The routine stays as it is.</span></span>
</button>
<button type="button" role="radio" aria-checked="true" style="width: 100%; min-height: 62px; box-sizing: border-box; padding: 12px 14px; border-radius: 16px; border: 2px solid #4B2E83; background: #E9E4FD; display: flex; align-items: flex-start; gap: 12px; text-align: left; color: #15111F">
<span aria-hidden="true" style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 10px; border: 6px solid #4B2E83; background: #FFFFFF; flex-shrink: 0; margin-top: 1px"></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">This and future days</span><span style="font-size: 12.5px; font-weight: 500; color: #3D3550">From Tue, Oct 6 on. Past days keep their original plan.</span></span>
</button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 2px">
<button type="button" style="height: 48px; border-radius: 24px; border: 1px solid #D6CEE6; background: #FFFFFF; color: #15111F; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2.5"></rect><path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"></path></svg>Duplicate</button>
<button type="button" style="height: 48px; border-radius: 24px; border: 1px solid #F0C9AE; background: #FBE3D2; color: #9A4317; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6"></path><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"></path><path d="M9 7V4.5h6V7"></path></svg>Delete routine</button>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {

</body>
</html>
